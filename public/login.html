<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Project Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-surface: #12121a;
            --bg-surface-hover: #1a1a2e;
            --accent-primary: #00ffc8;
            --danger: #ff3366;
            --text-primary: #e0e0e0;
            --text-secondary: #6b7280;
        }
        
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                linear-gradient(rgba(0, 255, 200, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 200, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        
        .login-card {
            background-color: var(--bg-surface);
            padding: 50px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 200, 0.15);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5), inset 0 0 30px rgba(0, 255, 200, 0.05);
            width: 100%;
            max-width: 400px;
        }
        
        .app-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            color: var(--accent-primary);
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 255, 200, 0.4);
            letter-spacing: 4px;
        }
        
        .tagline {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 40px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .input-group {
            margin-bottom: 25px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .input-group input {
            width: 100%;
            background-color: var(--bg-surface-hover);
            border: 1px solid rgba(0, 255, 200, 0.2);
            color: var(--text-primary);
            padding: 14px 16px;
            border-radius: 6px;
            outline: none;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .input-group input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px rgba(0, 255, 200, 0.2);
        }
        
        .login-btn {
            width: 100%;
            background-color: transparent;
            color: var(--accent-primary);
            border: 1px solid var(--accent-primary);
            padding: 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
        }
        
        .login-btn:hover {
            background-color: var(--accent-primary);
            color: var(--bg-primary);
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.5);
        }
        
        .error {
            color: var(--danger);
            text-align: center;
            font-size: 13px;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1 class="app-title">PROJECT DASHBOARD</h1>
        <p class="tagline">Human + Agent Shared State</p>
        
        <form id="login-form">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="ENTER USERNAME" autocomplete="off">
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="ENTER PASSWORD" autocomplete="off">
            </div>
            
            <button type="submit" class="login-btn">LOGIN</button>
        </form>
        
        <div class="error" id="error"></div>
    </div>
    
    <script>
        const loginForm = document.getElementById('login-form');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorDiv = document.getElementById('error');
        
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            
            if (!username || !password) {
                showError('Please enter both username and password');
                return;
            }
            
            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const result = await response.json();
                
                if (result.success && result.data.token) {
                    localStorage.setItem('token', result.data.token);
                    window.location.href = '/';
                } else {
                    showError(result.error?.message || 'Invalid username or password');
                }
            } catch (err) {
                showError('Connection error: ' + err.message);
            }
        });
        
        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        // Focus on username input on load
        usernameInput.focus();
    </script>
</body>
</html>
