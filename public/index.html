<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonPrompt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>NEONPROMPT</h1>
        <div class="header-actions">
            <div id="agent-status-bar" class="agent-status-bar"></div>
            <a href="/login.html" class="logout-btn" onclick="handleLogout(event)">LOGOUT</a>
        </div>
    </div>
    <div class="workspace">
        <div class="sidebar">
            <div style="margin-bottom: 25px; display: flex; gap: 10px; flex-direction: column;">
                <input type="text" id="new-project" placeholder="NEW PROJECT..." style="font-family: 'Orbitron', sans-serif; letter-spacing: 1px; font-size: 12px; text-transform: uppercase;">
                <button class="add-btn" onclick="addProject()">+</button>
            </div>
            <ul id="project-list"></ul>
        </div>
        <div class="main">
            <h2 id="current-project-title" style="border-bottom: 1px solid rgba(0, 255, 200, 0.2); padding-bottom: 20px; margin-bottom: 25px; font-size: 28px; letter-spacing: 2px;">SELECT A PROJECT</h2>
            <div id="task-container" style="display: none;">
                <div id="add-task-form" class="add-task-form" style="display: none;">
                    <h3 style="margin-bottom: 20px; color: #7b61ff; letter-spacing: 2px; font-size: 14px;">+ NEW TASK</h3>
                    <div class="form-row">
                        <input type="text" id="task-title" placeholder="TITLE *" required style="flex-grow: 1;">
                    </div>
                    <div class="form-row">
                        <textarea id="task-prompt" placeholder="PROMPT (optional)" rows="4"></textarea>
                    </div>
                    <div class="form-row">
                        <select id="task-priority">
                            <option value="low">LOW</option>
                            <option value="medium" selected>MEDIUM</option>
                            <option value="high">HIGH</option>
                            <option value="urgent">URGENT</option>
                        </select>
                        <input type="text" id="task-assigned" placeholder="ASSIGNED TO (optional)">
                    </div>
                    <div class="form-row form-actions">
                        <button class="btn btn-cancel" onclick="closeAddTaskForm()">CANCEL</button>
                        <button class="btn btn-primary" onclick="createTask()">CREATE</button>
                    </div>
                </div>
                <button class="add-task-btn" onclick="toggleAddTaskForm()">+ NEW TASK</button>
                <div id="task-list"></div>
            </div>
        </div>
    </div>
    <script>
        if (!localStorage.getItem('token')) {
            window.location.href = '/login.html';
        }
        function authHeaders() {
            const token = localStorage.getItem('token');
            return {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            };
        }
        let currentProjectId = null;
        const API = '/api/v1';

        let agentInterval = null;
        async function loadAgents() {
            try {
                const result = await fetchSafe(API + '/agents');
                if (!result) return;
                const agents = result;
                const statusBar = document.getElementById('agent-status-bar');
                if (agents.length === 0) {
                    statusBar.innerHTML = '';
                    return;
                }
                statusBar.innerHTML = agents.map(a => {
                    const statusColor = a.status === 'working' ? '#00ffc8' : (a.status === 'error' ? '#ff3366' : '#6b7280');
                    const statusGlow = a.status === 'working' ? 'box-shadow: 0 0 8px #00ffc8' : (a.status === 'error' ? 'box-shadow: 0 0 8px #ff3366' : '');
                    const workingInfo = a.current_task_title ? `<span class="agent-working-on">${a.current_task_title}</span>` : '';
                    return `
                        <div class="agent-status-item" style="--status-color: ${statusColor}; ${statusGlow}">
                            <span class="agent-dot"></span>
                            <span class="agent-label">${a.agent_label}</span>
                            ${workingInfo}
                        </div>
                    `;
                }).join('');
            } catch (err) {
                console.error('Failed to load agents:', err);
            }
        }

        loadAgents();
        agentInterval = setInterval(loadAgents, 30000);

        async function fetchSafe(url, options = {}) {
            options.credentials = "include";
            options.headers = { ...authHeaders(), ...(options.headers || {}) };
            try {
                const res = await fetch(url, options);
                if (res.status === 401) {
                    localStorage.removeItem('token');
                    window.location.href = '/login.html';
                    return null;
                }
                if (!res.ok) {
                    const errorText = await res.text();
                    throw new Error("Server Error (" + res.status + "): " + errorText);
                }
                const result = await res.json();
                if (!result.success) {
                    throw new Error(result.error.message || 'API Error');
                }
                return result.data;
            } catch (err) {
                console.error('Fetch Error:', err);
                alert('Connection Error: ' + err.message);
                throw err;
            }
        }

        async function loadProjects() {
            const result = await fetchSafe(API + '/projects');
            if (!result) return;
            const projects = result;
            const list = document.getElementById('project-list');
            list.innerHTML = projects.map(p => {
                const safeName = p.name.replace(/'/g, "\\'");
                return `<li class="${p.id === currentProjectId ? 'active' : ''}" data-project-id="${p.id}" data-project-name="${safeName}"><span>${p.name.toUpperCase()}</span><button class="del-btn" data-action="delete" title="Delete Project">×</button></li>`;
            }).join('');
        }

        function getPriorityClass(priority) {
            if (!priority) return 'priority-medium';
            return 'priority-' + (priority || 'medium').toLowerCase();
        }

        function getPriorityLabel(priority) {
            if (!priority) return 'MED';
            return (priority || 'medium').substring(0, 3).toUpperCase();
        }

        function getTaskStatusClass(status) {
            if (status === 'done') return 'completed';
            if (status === 'blocked') return 'blocked';
            if (status === 'in_progress') return 'in-progress';
            if (status === 'drafted') return 'drafted';
            if (status === 'needs_revision') return 'needs-revision';
            return '';
        }

        function getStatusBadgeStyle(status) {
            const styles = {
                drafted:        'background: rgba(123,97,255,0.15); border: 1px solid #7b61ff; color: #7b61ff;',
                todo:           'background: rgba(107,114,128,0.15); border: 1px solid rgba(107,114,128,0.4); color: #6b7280;',
                in_progress:    'background: rgba(0,255,200,0.15); border: 1px solid #00ffc8; color: #00ffc8;',
                done:           'background: rgba(0,255,200,0.15); border: 1px solid #00ffc8; color: #00ffc8;',
                blocked:        'background: rgba(255,51,102,0.15); border: 1px solid #ff3366; color: #ff3366;',
                needs_revision: 'background: rgba(255,159,28,0.15); border: 1px solid #ff9f1c; color: #ff9f1c;',
            };
            return styles[status] || styles.todo;
        }

        function getStatusLabel(status) {
            if (status === 'todo') return 'TODO';
            if (status === 'in_progress') return 'IN PROGRESS';
            if (status === 'done') return 'DONE';
            if (status === 'blocked') return 'BLOCKED';
            if (status === 'drafted') return 'DRAFTED';
            if (status === 'needs_revision') return 'NEEDS REVISION';
            return status ? status.toUpperCase() : '';
        }

        function formatTokens(tokens) {
            if (!tokens) return '0';
            if (tokens < 1000) return tokens.toString();
            return (tokens / 1000).toFixed(1) + 'k';
        }

        function selectProject(id, name) {
            currentProjectId = id;
            document.getElementById('current-project-title').innerText = name.toUpperCase();
            document.getElementById('task-container').style.display = 'block';
            closeAddTaskForm();
            loadProjects();
            loadTasks();
        }

        async function loadTasks() {
            if (!currentProjectId) return;
            const tasks = await fetchSafe(API + '/tasks/project/' + currentProjectId);
            if (!tasks) return;
            const list = document.getElementById('task-list');
            list.innerHTML = tasks.map(t => {
                const statusClass = getTaskStatusClass(t.status);
                const statusLabel = getStatusLabel(t.status);
                const priorityClass = getPriorityClass(t.priority);
                const priorityLabel = getPriorityLabel(t.priority);
                const assignedHtml = t.assigned_to ? '<span class="assigned-to">@' + t.assigned_to + '</span>' : '';

                // Progress bar
                const progressHtml = t.progress > 0 ? `
                    <div class="progress-container">
                        <div class="progress-bar" style="width: ${t.progress}%"></div>
                    </div>
                    <span class="progress-text">${t.progress}%</span>
                ` : '';

                // Model/token info
                const modelInfoHtml = t.model_used ? `
                    <div class="model-info">
                        🤖 ${t.model_used} · ${formatTokens(t.tokens_in)} in · ${formatTokens(t.tokens_out)} out
                    </div>
                ` : '';

                // Prompt section
                const promptHtml = t.prompt ? `
                    <div class="prompt-section">
                        <div class="section-header">PROMPT</div>
                        <div class="code-block">${escapeHtml(t.prompt)}</div>
                    </div>
                ` : '';

                // Output section (always shown, editable)
                const outputHtml = `
                    <div class="output-section">
                        <div class="section-header">OUTPUT</div>
                        <textarea class="output-textarea" id="output-textarea-${t.id}">${escapeHtml(t.output || '')}</textarea>
                        <button class="save-output-btn" onclick="saveOutput(${t.id}); event.stopPropagation();">SAVE OUTPUT</button>
                    </div>
                `;

                // Blocked reason
                const blockedHtml = t.status === 'blocked' && t.blocked_reason ? `
                    <div class="blocked-reason">⛔ ${t.blocked_reason}</div>
                ` : '';

                return `
                    <div class="task-item ${statusClass}" data-task-id="${t.id}">
                        <div class="task-header">
                            <button class="status-dropdown-btn" onclick="toggleTaskDropdown(${t.id})">
                                <span class="status-badge" style="${getStatusBadgeStyle(t.status)}">${statusLabel}</span>
                            </button>
                            <div class="status-dropdown" id="dropdown-${t.id}" style="display: none;">
                                <div class="status-option ${t.status === 'drafted' ? 'selected' : ''}" data-status="drafted" style="color: #7b61ff;">DRAFTED</div>
                                <div class="status-option ${t.status === 'todo' ? 'selected' : ''}" data-status="todo" style="color: #6b7280;">TODO</div>
                                <div class="status-option ${t.status === 'in_progress' ? 'selected' : ''}" data-status="in_progress" style="color: #00ffc8;">IN PROGRESS</div>
                                <div class="status-option ${t.status === 'done' ? 'selected' : ''}" data-status="done" style="color: #00ffc8;">DONE</div>
                                <div class="status-option ${t.status === 'blocked' ? 'selected' : ''}" data-status="blocked" style="color: #ff3366;">BLOCKED</div>
                                <div class="status-option ${t.status === 'needs_revision' ? 'selected' : ''}" data-status="needs_revision" style="color: #ff9f1c;">NEEDS REVISION</div>
                            </div>
                            <div class="task-actions">
                                <button class="del-btn" onclick="deleteTask(${t.id})" title="Delete Task">×</button>
                            </div>
                        </div>
                        <div class="task-title-row">
                            <span class="priority-badge ${priorityClass}">${priorityLabel}</span>
                            <span>${t.title}</span>
                            ${assignedHtml}
                        </div>
                        <div class="task-expanded">
                            ${promptHtml}
                            ${outputHtml}
                            ${progressHtml}
                            ${modelInfoHtml}
                            ${blockedHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function createTask() {
            const titleInput = document.getElementById('task-title');
            const promptInput = document.getElementById('task-prompt');
            const priorityInput = document.getElementById('task-priority');
            const assignedInput = document.getElementById('task-assigned');

            const title = titleInput.value.trim();
            const prompt = promptInput.value.trim();
            const assigned = assignedInput.value.trim();
            const priority = priorityInput.value;

            if (!title) {
                alert('Title is required');
                return;
            }

            const status = prompt ? 'drafted' : 'todo';

            await fetchSafe(API + '/tasks/project/' + currentProjectId, {
                method: 'POST',
                body: JSON.stringify({
                    title,
                    prompt,
                    priority,
                    assigned_to: assigned || null,
                    status
                })
            });

            closeAddTaskForm();
            titleInput.value = '';
            promptInput.value = '';
            assignedInput.value = '';
            loadTasks();
        }

        async function deleteTask(id) {
            if (!confirm('Delete task?')) return;
            await fetchSafe(API + '/tasks/' + id, { method: 'DELETE' });
            loadTasks();
        }

        async function toggleTaskDropdown(id) {
            const dropdown = document.getElementById('dropdown-' + id);
            const allDropdowns = document.querySelectorAll('.status-dropdown');
            allDropdowns.forEach(d => {
                if (d.id !== 'dropdown-' + id) d.style.display = 'none';
            });
            dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
        }

        async function changeTaskStatus(id, status) {
            await fetchSafe(API + '/tasks/' + id, {
                method: 'PATCH',
                body: JSON.stringify({ status })
            });
            loadTasks();
        }

        function toggleAddTaskForm() {
            const form = document.getElementById('add-task-form');
            const btn = document.querySelector('.add-task-btn');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
            btn.style.display = form.style.display === 'none' ? 'block' : 'none';
            if (form.style.display === 'block') {
                document.getElementById('task-title').focus();
            }
        }

        function closeAddTaskForm() {
            const form = document.getElementById('add-task-form');
            const btn = document.querySelector('.add-task-btn');
            form.style.display = 'none';
            btn.style.display = 'block';
        }

        function handleLogout(event) {
            event.preventDefault();
            if (agentInterval) clearInterval(agentInterval);
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        }

        document.getElementById('task-title').addEventListener('keypress', function (e) { if (e.key === 'Enter') createTask(); });

        document.getElementById('new-project').addEventListener('keypress', function (e) { if (e.key === 'Enter') addProject(); });

        document.getElementById('project-list').addEventListener('click', (e) => {
            const li = e.target.closest('li');
            if (!li) return;

            const projectId = li.dataset.projectId;
            const projectName = li.dataset.projectName;

            if (e.target.classList.contains('del-btn') || e.target.dataset.action === 'delete') {
                e.stopPropagation();
                deleteProject(projectId, e);
                return;
            }

            selectProject(projectId, projectName);
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.status-dropdown-btn')) {
                document.querySelectorAll('.status-dropdown').forEach(d => d.style.display = 'none');
            }
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function saveOutput(taskId) {
            const textarea = document.getElementById('output-textarea-' + taskId);
            await fetchSafe(API + '/tasks/' + taskId, {
                method: 'PATCH',
                body: JSON.stringify({ output: textarea.value })
            });
        }

        document.getElementById('task-list').addEventListener('click', (e) => {
            if (e.target.closest('.status-dropdown-btn') ||
                e.target.closest('.status-dropdown') ||
                e.target.closest('.del-btn') ||
                e.target.closest('.save-output-btn') ||
                e.target.tagName === 'TEXTAREA' ||
                e.target.tagName === 'BUTTON') return;

            const taskItem = e.target.closest('.task-item');
            if (!taskItem) return;

            taskItem.classList.toggle('expanded');
        });

        loadProjects();
    </script>
</body>
</html>
