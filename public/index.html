<!DOCTYPE html>
<html>
<head>
    <title>Project Dashboard</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0;
            padding: 5px 10px; 
            background-color: #1a1a1a; 
            color: #e0e0e0;
            display: grid; 
            grid-template-columns: 280px 1fr; 
            gap: 20px; 
            height: 100vh;
            box-sizing: border-box;
        }
        .header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2a2a2a;
            padding: 8px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        .header h1 {
            margin: 0;
            color: #4a9eff;
            font-size: 1.5rem;
        }
        .logout-btn {
            background-color: #444;
            color: white;
            border: 1px solid #555;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .logout-btn:hover {
            background-color: #555;
            border-color: #666;
        }
        .sidebar { 
            background: #2a2a2a; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
            overflow-y: auto;
        }
        .main { 
            background: #2a2a2a; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
            overflow-y: auto;
        }
        h2 { color: #4a9eff; margin-top: 0; }
        ul { list-style: none; padding: 0; }
        li { 
            padding: 12px; 
            border-bottom: 1px solid #3d3d3d; 
            cursor: pointer; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            transition: background 0.2s;
        }
        li.active { background: #3d3d3d; border-left: 4px solid #4a9eff; }
        li:hover { background-color: #353535; }
        li span { flex-grow: 1; }
        .task-item { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 12px; 
            border-bottom: 1px solid #3d3d3d; 
        }
        .task-item.completed span { text-decoration: line-through; color: #777; }
        input[type="checkbox"] { margin-right: 15px; transform: scale(1.2); cursor: pointer; }
        .add-btn { background: #4a9eff; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        .add-btn:hover { background: #357abd; }
        .del-btn { color: #ff5252; background: none; border: none; cursor: pointer; font-size: 1.2em; padding: 0 5px; opacity: 0.6; transition: opacity 0.2s; }
        .del-btn:hover { opacity: 1; transform: scale(1.1); }
        input[type="text"] { 
            padding: 10px; 
            border: 1px solid #444; 
            border-radius: 4px; 
            background-color: #1a1a1a;
            color: white;
            box-sizing: border-box;
        }
        #current-project-title { color: #4a9eff; border-bottom: 1px solid #3d3d3d; padding-bottom: 10px; margin-top: 0; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Project Dashboard</h1>
        <a href="/logout" class="logout-btn">Logout</a>
    </div>

    <div class="sidebar">
        <h2>Projects</h2>
        <div style="margin-bottom: 15px; display: flex; gap: 5px;">
            <input type="text" id="new-project" placeholder="New Project..." style="flex-grow: 1;">
            <button class="add-btn" onclick="addProject()">+</button>
        </div>
        <ul id="project-list"></ul>
    </div>
    
    <div class="main">
        <h1 id="current-project-title">Select a Project</h1>
        <div id="task-container" style="display: none;">
            <div style="margin-bottom: 20px; display: flex; gap: 10px;">
                <input type="text" id="new-task" placeholder="Add a new task..." style="flex-grow: 1;">
                <button class="add-btn" onclick="addTask()">Add Task</button>
            </div>
            <div id="task-list"></div>
        </div>
    </div>

    <script>
        let currentProjectId = null;
        const API = '/api';

        async function loadProjects() {
            const res = await fetch(`${API}/projects`);
            if (res.status === 401) {
                window.location.href = '/login';
                return;
            }
            const projects = await res.json();
            const list = document.getElementById('project-list');
            list.innerHTML = projects.map(p => `
                <li class="${p.id === currentProjectId ? 'active' : ''}">
                    <span onclick="selectProject(${p.id}, '${p.name}')">${p.name}</span>
                    <button class="del-btn" onclick="deleteProject(${p.id}, event)" title="Delete Project">×</button>
                </li>
            `).join('');
        }

        async function selectProject(id, name) {
            currentProjectId = id;
            document.getElementById('current-project-title').innerText = name;
            document.getElementById('task-container').style.display = 'block';
            loadProjects(); 
            loadTasks();
        }

        async function loadTasks() {
            if (!currentProjectId) return;
            const res = await fetch(`${API}/tasks/${currentProjectId}`);
            const tasks = await res.json();
            const list = document.getElementById('task-list');
            list.innerHTML = tasks.map(t => `
                <div class="task-item ${t.completed ? 'completed' : ''}">
                    <div>
                        <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask(${t.id}, this.checked)">
                        <span>${t.title}</span>
                    </div>
                    <button class="del-btn" onclick="deleteTask(${t.id})" title="Delete Task">×</button>
                </div>
            `).join('');
        }

        async function addProject() {
            const name = document.getElementById('new-project').value;
            if (!name) return;
            await fetch(`${API}/projects`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            document.getElementById('new-project').value = '';
            loadProjects();
        }

        async function deleteProject(id, event) {
            if (event) event.stopPropagation(); 
            if (!confirm('Are you sure you want to delete this project and ALL its tasks?')) return;
            
            await fetch(`${API}/projects/${id}`, { method: 'DELETE' });
            
            if (currentProjectId === id) {
                currentProjectId = null;
                document.getElementById('current-project-title').innerText = 'Select a Project';
                document.getElementById('task-container').style.display = 'none';
            }
            loadProjects();
        }

        async function addTask() {
            const input = document.getElementById('new-task');
            const title = input.value;
            if (!title || !currentProjectId) return;
            
            await fetch(`${API}/tasks`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ projectId: currentProjectId, title })
            });
            input.value = '';
            loadTasks();
            input.focus();
        }

        async function toggleTask(id, completed) {
            await fetch(`${API}/tasks/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ completed: completed ? 1 : 0 })
            });
            loadTasks();
        }

        async function deleteTask(id) {
            if (!confirm('Delete task?')) return;
            await fetch(`${API}/tasks/${id}`, { method: 'DELETE' });
            loadTasks();
        }

        document.getElementById('new-task').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') addTask();
        });

        document.getElementById('new-project').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') addProject();
        });

        loadProjects();
    </script>
</body>
</html>
